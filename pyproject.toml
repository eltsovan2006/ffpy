[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ffpy"
version = "0.4.0"
description = "Firefly/GAMESS-style input front end for PySCF"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Eltsov Andrey" }]
requires-python = ">=3.11"
dependencies = ["pyscf>=2.6", "geometric>=1.0", "numpy"]

[project.optional-dependencies]
gui = ["PySide6>=6.5"]
test = ["pytest"]
docx = ["python-docx>=1.0"]
mcp = ["mcp>=1.2"]

[project.scripts]
ffpy = "ffpy.cli:main"
ffpy-mcp = "ffpy.mcp_server:main"

[project.gui-scripts]
ffpy-gui = "ffpy.gui.app:main"

[tool.setuptools.packages.find]
include = ["ffpy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
