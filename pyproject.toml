[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ffpy"
version = "0.2.1"
description = "Firefly/GAMESS-style input front end for PySCF"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pyscf>=2.6", "geometric>=1.0", "numpy"]

[project.optional-dependencies]
gui = ["PySide6>=6.5"]
test = ["pytest"]

[project.scripts]
ffpy = "ffpy.cli:main"

[project.gui-scripts]
ffpy-gui = "ffpy.gui.app:main"

[tool.setuptools.packages.find]
include = ["ffpy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
